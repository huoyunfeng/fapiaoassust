# 授权服务反向代理配置（仅 HTTPS 阶段需要；HTTP 调试期可不用 nginx）
#
# 阶段一（当前，调试）：uvicorn 直接监听 0.0.0.0:80，
#   客户端请求 http://fapiao-assist.xyz/api/get_license，无需启动 nginx。
#   —— 本阶段请勿启动下方 80 块，会与 uvicorn 抢占 80 端口。
#
# 阶段二（域名已解析到本机，启用 HTTPS）：
#   1) 把 systemd 单元里的 CLOUD_PORT 改为 8000，让 uvicorn 只监听 127.0.0.1:8000
#      （license_server.py 监听地址改为 127.0.0.1，或保留 0.0.0.0 但用防火墙封 8000）
#      systemctl restart fapiao-license
#   2) 申请证书：certbot certonly --nginx -d fapiao-assist.xyz
#   3) 取消下方 80/443 块的注释
#   4) 客户端改为 FAPIAO_CLOUD_URL=https://fapiao-assist.xyz
#      （基址，不带 /api/... 路径；路径由 app/service/license_service.py 拼接）
#   5) 云端 license_server.py 的 NOTIFY_URL 同步改为 https 域名（虎皮椒回调）

