<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}发票报销核对助手{% endblock %}</title>
<style>
/* ============================================================
   全局设计 Token（全系统唯一色彩 / 圆角 / 阴影 / 间距来源）
   所有页面只允许引用变量，禁止再硬编码色值
   ============================================================ */
:root{
  /* 主色（企业蓝） */
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#eff6ff;--primary-border:#bfdbfe;
  /* 语义色：浅底 + 深字 */
  --success:#52c41a;--success-text:#389e0d;--success-bg:#f0f9eb;--success-border:#c2e7b0;
  --warning:#faad14;--warning-text:#d48806;--warning-bg:#fdf6ec;--warning-border:#faecd8;
  --danger:#ff4d4f;--danger-text:#cf1322;--danger-bg:#fef0f0;--danger-border:#fde2e2;
  /* 文字与背景 */
  --bg:#f5f7fa;--card:#fff;
  --border:#e4e7ed;--border-light:#ebeef5;
  --text:#303133;--text-2:#606266;--text-3:#909399;--muted:#909399;
  /* 圆角 / 阴影 / 间距 */
  --radius-card:8px;--radius:4px;
  --shadow-card:0 2px 12px 0 rgba(0,0,0,.05);
  --shadow-hover:0 4px 16px 0 rgba(0,0,0,.1);
  --space:20px;
  /* 统一过渡：消除生硬跳变 */
  --transition:all .3s ease;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
/* 按钮/表单控件默认不继承 body 字体，强制继承保持全局字体协调 */
button,input,select,textarea{font-family:inherit;color:inherit;}
.nav{background:var(--card);border-bottom:1px solid var(--border-light);padding:0 20px;display:flex;align-items:center;gap:4px;height:56px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.nav .brand{font-weight:700;font-size:16px;margin-right:24px;color:var(--primary);}
.nav a{padding:8px 14px;border-radius:var(--radius);color:var(--text-2);text-decoration:none;transition:var(--transition);}
.nav a:hover,.nav a.active{background:var(--primary-light);color:var(--primary);}
.container{max-width:1560px;margin:var(--space) auto;padding:0 var(--space);}
/* 卡片：8px 圆角 + 极浅阴影，去掉生硬边框（保留透明边框位，便于风险卡片着色） */
.card{background:var(--card);border:1px solid transparent;border-radius:var(--radius-card);padding:var(--space);margin-bottom:var(--space);box-shadow:var(--shadow-card);transition:var(--transition);}
.card h2{font-size:16px;font-weight:600;margin-bottom:14px;}
/* 列表页大卡片：搜索区 + 极细分割线 + 表格区，同一白底，不出现灰色断层 */
.list-card{padding:0;overflow:hidden;}
.list-filter{padding:var(--space);}
.card-divider{height:1px;background:var(--border-light);}
.list-body{padding:16px var(--space) var(--space);}
/* 卡片风险态 + 容量进度条（替代页面内联硬编码颜色） */
.card-warn{border-color:var(--warning-border);background:var(--warning-bg);}
.progress{max-width:420px;height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-top:10px;}
.progress-fill{height:100%;background:var(--primary);transition:var(--transition);}
.progress-fill.warn{background:var(--warning);}
.warn-text{margin-top:10px;color:var(--warning-text);font-size:13px;}
/* 页面标题栏 */
.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:var(--space);}
.page-head h1{font-size:20px;font-weight:600;color:var(--text);}
.page-head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
/* 统计卡片：悬停微上浮 + 阴影加深 */
.stat{background:var(--card);border:1px solid transparent;border-radius:var(--radius-card);padding:var(--space);box-shadow:var(--shadow-card);transition:var(--transition);}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
.stat .num{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;}
.stat .label{color:var(--text-2);font-size:13px;}
/* 表格：浅灰表头 + 宽裕行距 + 整行 hover；文本左 / 数字右 / 状态与操作居中 */
table{width:100%;border-collapse:collapse;}
th,td{padding:12px 8px;border-bottom:1px solid var(--border-light);text-align:left;white-space:nowrap;vertical-align:middle;transition:background .3s ease;}
tbody td{height:48px;}
th{color:var(--text-2);font-weight:600;background:#f8f9fa;font-size:13px;}
tr:hover td{background:var(--bg);}
td.wrap{white-space:normal;min-width:160px;}
td.num,th.num,.ta-r{text-align:right;}
td.num{font-variant-numeric:tabular-nums;}
.ta-c,td.center,th.center{text-align:center;}
.ta-l{text-align:left;}
/* 发票表格：固定布局，列宽按 colgroup 分配，长文本省略号 */
.invoice-table{table-layout:fixed;width:100%;}
.invoice-table th,.invoice-table td{padding:12px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;}
.invoice-table tbody td{height:auto;}
.invoice-table .col-number{text-align:right;font-variant-numeric:tabular-nums;}
.invoice-table .col-action{width:88px;min-width:88px;overflow:visible;}
.invoice-table td.col-action{overflow:visible;}
/* 操作按钮：文字与箭头不折行；高度与全局按钮统一 */
.action-btn{white-space:nowrap;padding:0 10px;}
/* 标签：统一「浅底 + 深字 + 细边框」，不使用生硬实心色块 */
.badge{display:inline-block;padding:1px 8px;border-radius:var(--radius);font-size:12px;font-weight:500;line-height:20px;border:1px solid transparent;transition:var(--transition);}
.badge-green{background:var(--success-bg);color:var(--success-text);border-color:var(--success-border);}
.badge-red{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-border);}
.badge-orange{background:var(--warning-bg);color:var(--warning-text);border-color:var(--warning-border);}
.badge-blue{background:var(--primary-light);color:var(--primary-dark);border-color:var(--primary-border);}
.badge-purple{background:#f4f0ff;color:#5b21b6;border-color:#e4d9ff;}
.badge-gray{background:#f4f4f5;color:var(--text-2);border-color:#e9e9eb;}
.badge-yellow{background:var(--warning-bg);color:var(--warning-text);border-color:var(--warning-border);}
/* 写操作按钮 Loading：点击后立即禁用并显示转圈，直到接口返回 */
.btn.is-loading,.btn.is-loading:hover{opacity:.75;cursor:progress;filter:none;}
.btn-spin{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;
  border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
  animation:btnSpin .7s linear infinite;}
@keyframes btnSpin{to{transform:rotate(360deg);}}
/* 费用分类标签：分类名 + 确认状态（已确认绿 / 待确认黄），可点击修改 */
.cat-tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;
  cursor:pointer;border:1px solid transparent;white-space:nowrap;line-height:1.6;}
.cat-tag:hover{filter:brightness(.96);}
.cat-tag.confirmed{background:var(--success-bg);color:var(--success-text);border-color:var(--success-border);}
.cat-tag.pending{background:var(--warning-bg);color:var(--warning-text);border-color:var(--warning-border);}
/* 未报销的游离发票：系统推测分类用 dashed 边框区分 */
.cat-tag.orphan{border-style:dashed;}
/* 未匹配发票的报销单：标签只读，不出现手型 */
.cat-tag.static{cursor:default;}
/* 费用分类下拉菜单（fixed 挂 body，避免被表格容器截断） */
.cat-menu{position:fixed;z-index:120;background:#fff;border:1px solid var(--border);border-radius:8px;
  box-shadow:0 8px 24px rgba(15,23,42,.16);padding:6px;min-width:170px;display:flex;flex-direction:column;}
.cat-menu-head{padding:4px 10px;font-size:12px;color:var(--muted);}
.cat-menu-sep{height:1px;background:var(--border);margin:4px 0;}
.cat-menu-item{border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;
  font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;}
.cat-menu-item:hover{background:#f1f5f9;}
.cat-menu-item.current{color:#166534;font-weight:600;}
.cat-menu-item .cat-check{font-size:12px;color:#16a34a;margin-left:4px;}
.cat-menu-item.accept{background:#fef3c7;color:#92400e;font-weight:600;}
.cat-menu-item.accept:hover{background:#fde68a;}
.cat-tag .cat-q{font-weight:700;}
.cat-tag .cat-warn{color:#dc2626;font-weight:700;}
/* 分类差异（黄色警示，非阻塞）：发票与报销单分类不一致 */
.cat-tag .cat-warn-y{color:#d97706;font-weight:700;}
.dropdown{position:relative;display:inline-block;}
/* 下拉菜单挂载到 body，fixed 定位，避免被表格容器截断 */
.dropdown-menu{display:none;position:fixed;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.1);min-width:96px;z-index:100;overflow:hidden;}
.dropdown-menu.open{display:block;}
.dropdown-menu a,.dropdown-menu button{display:block;width:100%;padding:8px 14px;text-align:left;border:0;background:none;font-size:13px;color:var(--text);cursor:pointer;text-decoration:none;}
.dropdown-menu a:hover,.dropdown-menu button:hover{background:#f5f7fa;}
.dropdown-menu .danger{color:var(--danger-text);}
/* 按钮：统一高度 36px（大按钮 40px），4px 圆角，主/次/危险三态 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--radius);
  border:1px solid transparent;background:var(--primary);color:#fff;cursor:pointer;font-size:13px;text-decoration:none;
  white-space:nowrap;transition:var(--transition);}
.btn:hover{background:var(--primary-dark);box-shadow:0 2px 6px rgba(37,99,235,.25);}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.btn-sm{height:28px;padding:0 10px;font-size:12px;}
.btn-lg{height:40px;padding:0 20px;font-size:14px;}
.btn-outline{background:#fff;color:var(--text-2);border-color:var(--border);}
.btn-outline:hover{background:#fff;border-color:var(--primary);color:var(--primary);box-shadow:none;}
.btn-danger{background:var(--danger);border-color:var(--danger);}
.btn-danger:hover{background:#f5222d;border-color:#f5222d;box-shadow:0 2px 6px rgba(255,77,79,.25);}
.btn-green{background:var(--success);border-color:var(--success);}
.btn-green:hover{background:#4aa50f;border-color:#4aa50f;box-shadow:0 2px 6px rgba(82,196,26,.25);}
/* 表单控件：统一高度 36px，聚焦时边框切换主色并带轻微光晕 */
input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{
  height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;
  background:#fff;color:var(--text);transition:var(--transition);}
textarea{height:auto;min-height:72px;padding:8px 12px;line-height:1.6;}
input:not([type=checkbox]):not([type=radio]):not([type=range]):focus,select:focus,textarea:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.12);}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);cursor:pointer;}
form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.muted{color:var(--muted);font-size:12px;}
.mt{margin-top:12px;}.mb{margin-bottom:12px;}
.link{color:var(--primary);text-decoration:none;}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:13px;}
.kv .k{color:var(--muted);}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-size:12px;overflow:auto;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;}
.modal{display:none;position:fixed;top:8%;left:50%;transform:translateX(-50%);background:#fff;border-radius:var(--radius-card);padding:24px;width:560px;max-height:84vh;overflow:auto;z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.18);}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px;}
.tabs .tab{padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--muted);}
.tabs .tab.active{color:var(--primary);border-color:var(--primary);font-weight:600;}
.tabpane{display:none;}.tabpane.active{display:block;}
.toast{position:fixed;top:70px;right:24px;background:#111827;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;display:none;max-width:420px;font-size:13px;}
/* 高危操作撤销提示：右下角常驻，带倒计时与撤销按钮 */
.undo-toast{position:fixed;right:24px;bottom:24px;z-index:120;display:none;align-items:center;gap:14px;
  background:#111827;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:440px;}
.undo-toast .undo-msg{flex:1;line-height:1.5;}
.undo-toast .undo-btn{background:none;border:1px solid #93c5fd;color:#93c5fd;border-radius:6px;
  padding:4px 12px;cursor:pointer;font-size:13px;white-space:nowrap;}
.undo-toast .undo-btn:hover{background:#93c5fd;color:#111827;}
.undo-toast .undo-count{color:#9ca3af;font-size:12px;min-width:40px;text-align:right;}
/* 底部分页组件 */
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}
.pager select{padding:4px 6px;}
.pager .btn[disabled]{opacity:.45;cursor:not-allowed;}
.pager-custom{display:inline-flex;align-items:center;gap:6px;}
.pager-custom input{width:120px;height:32px;padding:4px 8px;text-align:center;}
/* 空状态占位 */
.empty-state{text-align:center;color:var(--muted);padding:36px 0;font-size:14px;}
/* 全局忙碌遮罩：导入/删除等耗时操作期间显示进度并阻挡一切点击（z-index 高于弹窗/下拉/提示） */
.busy-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:999;align-items:center;justify-content:center;}
.busy-bg.on{display:flex;}
.busy-card{background:#fff;border-radius:12px;padding:26px 34px;width:380px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);}
.spinner{width:34px;height:34px;border:4px solid #e5e7eb;border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:busySpin .8s linear infinite;}
@keyframes busySpin{to{transform:rotate(360deg)}}
.busy-title{font-size:14px;font-weight:600;margin-bottom:12px;}
.progress-track{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;}
.progress-bar{height:100%;width:0;background:var(--primary);border-radius:6px;transition:width .25s;}
.progress-bar.indet{width:36%;transition:none;animation:busySlide 1.1s ease-in-out infinite;}
@keyframes busySlide{0%{margin-left:-40%}100%{margin-left:110%}}
.busy-detail{margin-top:10px;color:var(--muted);font-size:12px;min-height:16px;word-break:break-all;}
.busy-pct{margin-top:6px;font-size:12px;font-weight:600;color:var(--primary);min-height:15px;}
/* ---- 全局路由联动（上下文穿透） ---- */
/* 可点击的统计卡片 / 列表行：手型 + 上浮阴影提示 */
.stat-link{cursor:pointer;transition:var(--transition);}
.stat-link:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);}
/* 风险警示卡片：未匹配发票等需财务优先处理的风险数据 */
.stat-danger{border-color:var(--danger-border);}
.stat-danger:hover{box-shadow:0 4px 16px 0 rgba(255,77,79,.16);}
.stat-danger .num{color:var(--danger-text);}
.text-danger{color:var(--danger-text) !important;}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:#eff6ff;}
/* focus 定位高亮：黄色闪烁 3 次后自动恢复（animation 结束即回默认背景） */
@keyframes focusFlash{0%,100%{background:#fef9c3;}50%{background:#fde047;}}
tr.row-focus td{animation:focusFlash .7s ease-in-out 3;}
</style>
</head>
<body>
<div class="nav">
  <span class="brand">发票报销核对助手</span>
  <a href="/" {% if request.url.path=='/' %}class="active"{% endif %}>仪表盘</a>
  <a href="/invoices" {% if request.url.path.startswith('/invoices') %}class="active"{% endif %}>发票</a>
  <a href="/reimburses" {% if request.url.path.startswith('/reimburses') %}class="active"{% endif %}>报销单</a>
  <a href="/matches" {% if request.url.path.startswith('/matches') %}class="active"{% endif %}>匹配中心</a>
  <a href="/report" {% if request.url.path.startswith('/report') %}class="active"{% endif %}>差异报告</a>
  <a href="/settings" {% if request.url.path.startswith('/settings') %}class="active"{% endif %}>设置</a>
</div>
<div class="container">{% block content %}{% endblock %}</div>
<div class="modal-bg" id="modalBg" onclick="closeModal()"></div>
<div class="modal" id="modal">{% block modal %}{% endblock %}</div>
<div class="toast" id="toast"></div>
<div class="undo-toast" id="undoToast">
  <span class="undo-msg" id="undoMsg"></span>
  <button class="undo-btn" type="button" onclick="undoDeleteNow()">撤销</button>
  <span class="undo-count" id="undoCount"></span>
</div>
<div class="busy-bg" id="busyBg">
  <div class="busy-card">
    <div class="spinner"></div>
    <div class="busy-title" id="busyTitle">正在处理…</div>
    <div class="progress-track"><div class="progress-bar indet" id="busyBar"></div></div>
    <div class="busy-pct" id="busyPct"></div>
    <div class="busy-detail" id="busyDetail"></div>
  </div>
</div>
<script>
function toast(msg, ok=true){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  t.style.background=ok?'#52c41a':'#ff4d4f';
  setTimeout(()=>t.style.display='none',3500);
}
// ---- 高危操作撤销提示（右下角，20 秒倒计时）----
let _undoTimer=null, _undoFn=null;
function showUndoToast(msg, undoFn, seconds){
  seconds = seconds || 20;
  const box=document.getElementById('undoToast');
  document.getElementById('undoMsg').textContent=msg;
  _undoFn=undoFn;
  let left=seconds;
  document.getElementById('undoCount').textContent=left+'s';
  box.style.display='flex';
  clearInterval(_undoTimer);
  _undoTimer=setInterval(()=>{
    left--;
    document.getElementById('undoCount').textContent=left>0?left+'s':'';
    if(left<=0) hideUndoToast();
  },1000);
}
function hideUndoToast(){
  clearInterval(_undoTimer); _undoTimer=null; _undoFn=null;
  const box=document.getElementById('undoToast');
  if(box) box.style.display='none';
}
async function undoDeleteNow(){
  const fn=_undoFn;
  hideUndoToast();
  if(fn){ try{ await fn(); }catch(e){ toast('撤销失败，请稍后重试', false); } }
}
// 删除后跨页面保留撤销信息（页面刷新/跳转后仍能在 20 秒内撤销）
const UNDO_ENDPOINTS = {invoice:'/api/invoices/restore', reimburse:'/api/reimburses/restore'};
function stashUndo(kind, ids, msg){
  try{
    sessionStorage.setItem('undoDelete', JSON.stringify(
      {kind, ids, msg, expire: Date.now() + 20000}));
  }catch(e){}
}
function consumeUndo(){
  let u;
  try{ u = JSON.parse(sessionStorage.getItem('undoDelete') || 'null'); }catch(e){ u = null; }
  if(!u) return;
  sessionStorage.removeItem('undoDelete');
  const left = Math.round((u.expire - Date.now()) / 1000);
  if(left <= 0){ toast('删除已完成（撤销窗口已过期）'); return; }
  showUndoToast(u.msg, async ()=>{
    const fd = new FormData();
    fd.append('ids', (u.ids || []).join(','));
    const r = await fetch(UNDO_ENDPOINTS[u.kind] || '', {method:'POST', body:fd});
    const j = await r.json();
    const d = j.data || j;
    toast(d.message || (d.ok !== false ? '已撤销删除' : '撤销失败'), d.ok !== false);
    if(d.ok !== false) setTimeout(()=>location.reload(), 600);
  }, left);
}
document.addEventListener('DOMContentLoaded', consumeUndo);
// ---- 忙碌遮罩：显示期间覆盖全页，用户无法点击其它按钮 ----
function busyShow(title,detail){
  document.getElementById('busyTitle').textContent = title || '正在处理…';
  document.getElementById('busyDetail').textContent = detail || '';
  document.getElementById('busyBg').classList.add('on');
}
function busyDetail(text){ document.getElementById('busyDetail').textContent = text || ''; }
function busyProgress(pct, detail){
  const bar = document.getElementById('busyBar');
  bar.classList.remove('indet'); bar.style.width = Math.max(0,Math.min(100,pct)) + '%';
  document.getElementById('busyPct').textContent = Math.round(Math.max(0,Math.min(100,pct))) + '%';
  if(detail !== undefined) busyDetail(detail);
}
function busyIndet(title,detail){
  const bar = document.getElementById('busyBar');
  bar.classList.add('indet'); bar.style.width = '';
  document.getElementById('busyPct').textContent = '';
  busyShow(title,detail);
}
function busyDone(){ document.getElementById('busyBg').classList.remove('on'); }
async function post(url, data, opts){
  // 兼容多种入参：FormData / 表单元素 / 普通对象 / 空，避免 new FormData({}) 抛 TypeError
  let fd;
  if(data instanceof FormData){ fd = data; }
  else if(data instanceof HTMLFormElement){ fd = new FormData(data); }
  else if(data && typeof data === 'object'){ fd = new FormData(); for(const k in data){ if(data.hasOwnProperty(k)) fd.append(k, data[k] == null ? '' : data[k]); } }
  else { fd = new FormData(); }
  // 250ms 内完成的快操作不闪遮罩；慢操作出现「正在处理…」并阻挡点击
  const timer = setTimeout(()=>busyIndet(opts && opts.title), 250);
  try{
    const r = await fetch(url,{method:'POST',body:fd});
    const j = await r.json();
    if(j.ok===false || j.data && j.data.ok===false){toast(j.data?.message||j.message||'操作失败',false);}
    else{toast('操作成功');}
    return j;
  }finally{ clearTimeout(timer); busyDone(); }
}
function submitForm(e,url,after,title){e.preventDefault();post(url,e.target,{title}).then(j=>{if(!j.data||j.data.ok!==false){if(after)after(j);else location.reload();}});return false;}

// ---- 全局防连击 / 防重复提交（所有写操作按钮 + 跨标签页写入锁）----
// 1) 点击按钮瞬间：按钮进入 Loading（转圈 + disabled），接口返回后恢复；
// 2) 写请求（POST/PUT/PATCH/DELETE）在 localStorage 上加跨标签页写锁，
//    另一标签页同时提交会被拦截，避免重复入库。
const _FP_TAB_ID = (() => {
  try{ let v = sessionStorage.getItem('fp_tab_id');
    if(!v){ v = 't' + Date.now() + Math.random().toString(36).slice(2,8); sessionStorage.setItem('fp_tab_id', v); }
    return v;
  }catch(e){ return 't0'; }
})();
const _FP_WRITE_LOCK = 'fp_write_lock';
let _lastActionBtn = null, _lastActionAt = 0;
document.addEventListener('click', function(e){
  const b = e.target.closest('button, a.btn, input[type=submit]');
  if(b && !b.disabled){ _lastActionBtn = b; _lastActionAt = Date.now(); }
}, true);

function btnBusy(btn, on){
  if(!btn) return;
  if(on){
    if(btn._busy) return;
    btn._busy = true; btn._busyHtml = btn.innerHTML;
    btn.disabled = true; btn.classList.add('is-loading');
    btn.innerHTML = '<span class="btn-spin"></span>' + btn._busyHtml;
  }else{
    if(!btn._busy) return;
    btn._busy = false; btn.disabled = false; btn.classList.remove('is-loading');
    if(btn._busyHtml !== undefined) btn.innerHTML = btn._busyHtml;
  }
}

function _writeLocked(){
  try{
    const raw = localStorage.getItem(_FP_WRITE_LOCK);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.tab || d.tab === _FP_TAB_ID) return false;
    if(Date.now() - (d.t || 0) > 60000) return false;   // 过期锁自动失效（防标签页崩溃后死锁）
    return true;
  }catch(e){ return false; }
}
function _blockedResponse(msg){
  return new Response(JSON.stringify({ok:false, message:msg}),
    {status:200, headers:{'Content-Type':'application/json; charset=utf-8'}});
}

const _nativeFetch = window.fetch.bind(window);
window.fetch = async function(input, init){
  const url = (typeof input === 'string') ? input : ((input && input.url) || '');
  const method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
  const isWrite = ['POST','PUT','PATCH','DELETE'].includes(method);
  if(!isWrite) return _nativeFetch(input, init);

  if(_writeLocked()){
    return _blockedResponse('另一标签页正在提交写操作，请稍候再试');
  }
  // 仅当最近一次点击确实来自某个按钮时才接管它的 Loading 状态
  const btn = (_lastActionBtn && Date.now() - _lastActionAt < 2000) ? _lastActionBtn : null;
  _lastActionBtn = null;
  btnBusy(btn, true);
  try{ localStorage.setItem(_FP_WRITE_LOCK, JSON.stringify({tab:_FP_TAB_ID, t:Date.now(), url})); }catch(e){}
  try{
    return await _nativeFetch(input, init);
  }finally{
    try{
      const raw = localStorage.getItem(_FP_WRITE_LOCK);
      const d = raw ? JSON.parse(raw) : null;
      if(!d || d.tab === _FP_TAB_ID) localStorage.removeItem(_FP_WRITE_LOCK);
    }catch(e){}
    btnBusy(btn, false);
  }
};
function openModal(){document.getElementById('modalBg').style.display='block';document.getElementById('modal').style.display='block';}
function closeModal(){document.getElementById('modalBg').style.display='none';document.getElementById('modal').style.display='none';}
// 下拉菜单：操作列【操作】按钮展开，挂载到 body 用 fixed 定位（避免被表格 overflow 截断），点击外部/滚动时收起
function toggleDropdown(el){
  const menu = el._menu || el.parentElement.querySelector('.dropdown-menu');
  if(!menu) return;
  el._menu = menu;
  const wasOpen = menu.classList.contains('open');
  closeAllDropdowns();
  if(!wasOpen){
    if(menu.parentElement !== document.body) document.body.appendChild(menu);
    menu.classList.add('open');
    const r = el.getBoundingClientRect();
    menu.style.top = (r.bottom + 4) + 'px';
    menu.style.left = Math.max(8, r.right - menu.offsetWidth) + 'px';
  }
}
function closeAllDropdowns(){
  document.querySelectorAll('.dropdown-menu.open').forEach(m=>m.classList.remove('open'));
}
document.addEventListener('click', function(e){
  if(!e.target.closest('.dropdown-menu') && !e.target.closest('.action-btn')) closeAllDropdowns();
});
window.addEventListener('scroll', closeAllDropdowns, true);
window.addEventListener('resize', closeAllDropdowns);

// ---- 费用分类：发票列表与报销单列表共用同一套标签与菜单（两个页面联动） ----
const CAT_STD = {% if categories is defined %}{{ categories|tojson }}{% else %}["餐饮费","交通费","差旅费","办公费","通讯费","其他费用"]{% endif %};
let _catMenuEl = null;      // 当前挂载的菜单 DOM
let _catMenuTarget = null;  // 当前操作的 .cat-tag

function closeCatMenu(){
  if(_catMenuEl){ _catMenuEl.remove(); _catMenuEl = null; }
  _catMenuTarget = null;
}

function openCatMenu(e, el){
  if(e) e.stopPropagation();
  const reopen = (_catMenuTarget === el && _catMenuEl);
  closeCatMenu();
  if(reopen) return;   // 再次点击同一标签 = 收起

  const cur = el.dataset.cat || '';
  const suggest = el.dataset.suggest || '';
  const pending = el.dataset.status === 'PENDING';

  let html = '';
  if(pending && suggest && suggest !== cur){
    html += '<div class="cat-menu-head">系统推测为「' + suggest + '」</div>'
          + '<button class="cat-menu-item accept" onclick="saveCategory(\'' + suggest + '\')">✓ 一键确认为 ' + suggest + '</button>'
          + '<div class="cat-menu-sep"></div><div class="cat-menu-head">或改为：</div>';
  }else{
    html += '<div class="cat-menu-head">修改费用分类</div>';
  }
  CAT_STD.forEach(c => {
    const isCur = (c === cur);
    html += '<button class="cat-menu-item' + (isCur ? ' current' : '') + '" onclick="saveCategory(\'' + c + '\')">'
          + c + (isCur ? '<span class="cat-check">✓ 当前</span>' : '') + '</button>';
  });
  // 模块一：下拉菜单底部支持新增自定义分类（相似词会提示合并）
  html += '<div class="cat-menu-sep"></div>'
        + '<button class="cat-menu-item" onclick="addCategoryDlg()">＋ 新增自定义分类</button>';

  const m = document.createElement('div');
  m.className = 'cat-menu';
  m.innerHTML = html;
  m.addEventListener('click', ev => ev.stopPropagation());
  document.body.appendChild(m);

  // 定位：默认在标签下方，右侧/底部空间不足时自动左移或翻到上方
  const r = el.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let left = r.left;
  let top = r.bottom + 4;
  if(left + mw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - mw - 8);
  if(top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  m.style.left = left + 'px';
  m.style.top = top + 'px';

  _catMenuEl = m;
  _catMenuTarget = el;
}

// 保存分类：按「未匹配 / 已匹配」与主从法则处理
// - 未匹配发票：只改发票，随后弹出「摘要相似」统一批量面板（含已匹配记录）
// - 已匹配发票：提示主从法则（一对一连带同步报销单 / 一对多只改当前发票）
// - 未匹配报销单：只改报销单，不影响任何发票
// - 已匹配报销单：警告后无条件强制联动同步全部关联发票（主账变了，明细必须跟）
async function saveCategory(cat){
  const el = _catMenuTarget;
  closeCatMenu();
  if(!el) return;
  const kind = el.dataset.kind;
  const id = el.dataset.id;
  const matched = el.dataset.matched === '1';
  if(kind === 'reb' && matched){
    const ok = await confirmDlg(
      '该报销单已匹配发票。修改分类将无条件同步其关联的所有发票明细分类（主从联动），是否继续？');
    if(!ok) return;
    await _saveRebCategory(id, cat, 'sync');
  }else if(kind === 'reb'){
    await _saveRebCategory(id, cat, 'self');
  }else if(matched){
    const ok = await confirmDlg(
      '该发票已匹配报销单，将按主从法则处理：一对一匹配连带同步报销单；一对多只改当前发票（可能与报销单产生分类差异）。是否继续？');
    if(!ok) return;
    await _saveInvCategory(id, cat);
  }else{
    await _saveInvCategory(id, cat);
  }
}

async function _postData(url, fd){
  try{
    const r = await fetch(url, {method:'POST', body: fd || new FormData()});
    const j = await r.json();
    return (j && j.data) ? j.data : j;
  }catch(e){ return {ok:false, message:'网络错误：' + e.message}; }
}
async function _getData(url){
  try{
    const r = await fetch(url);
    const j = await r.json();
    return (j && j.data) ? j.data : j;
  }catch(e){ return {ok:false, message:'网络错误：' + e.message}; }
}

async function _saveRebCategory(id, cat, mode){
  const fd = new FormData();
  fd.append('category', cat);
  fd.append('mode', mode);
  const d = await _postData('/api/reimburses/' + id + '/category', fd);
  if(!d || d.ok === false){ toast((d && d.message) || '保存失败', false); return; }
  toast(d.message || ('已保存分类：' + cat));
  setTimeout(() => location.reload(), 700);
}

async function _saveInvCategory(id, cat){
  const fd = new FormData();
  fd.append('category', cat);
  const d = await _postData('/api/invoices/' + id + '/category', fd);
  if(!d || d.ok === false){ toast((d && d.message) || '保存失败', false); return; }
  // 统一触发：无论是否匹配，都查找「相似记录」池，弹批量确认面板（三层判定：归类大类/商家字号/摘要关键词）
  const sim = await _getData('/api/invoices/' + id + '/similar');
  if(sim && sim.items && sim.items.length){
    toast(d.message || ('已保存分类：' + cat));
    openBatchPanel(cat, sim.items, sim.basis || []);
  }else{
    toast(d.message || ('已保存分类：' + cat));
    setTimeout(() => location.reload(), 700);
  }
}

function _escHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 模块二：统一批量归类确认面板（默认全选，可取消勾选；含已匹配记录，实时勾选计数）
// 三层相似判定：归类大类 / 商家字号 / 摘要关键词；命中词高亮 + 命中原因列
function _hlHits(text, hits){
  let html = _escHtml(text || '—');
  (hits || []).forEach(h => {
    if(!h) return;
    html = html.split(_escHtml(h)).join('<mark style="background:#fde68a;color:#92400e;border-radius:2px;padding:0 1px;">' + _escHtml(h) + '</mark>');
  });
  return html;
}
function openBatchPanel(category, items, basis){
  const m = document.getElementById('modal');
  const rows = items.map(it => `
    <tr>
      <td style="text-align:center;"><input type="checkbox" class="batch-chk" value="${it.id}" data-matched="${it.matched ? 1 : 0}" checked></td>
      <td>#${it.id}</td>
      <td>${_escHtml(it.invoice_no || '—')}</td>
      <td>${_escHtml(it.invoice_date || '—')}</td>
      <td class="wrap">${_hlHits(it.item_summary, it.hits)}</td>
      <td class="wrap muted">${_hlHits(it.seller_name, it.hits)}</td>
      <td>${_escHtml(it.category || '—')}</td>
      <td>${it.matched ? '<span class="badge badge-blue">已匹配 ' + _escHtml(it.reimburse_no || '') + '</span>' : '<span class="muted">未匹配</span>'}</td>
      <td class="muted" style="font-size:12px;">${_escHtml(it.reason || '')}</td>
      <td style="text-align:right;">${_escHtml(it.total_amount || '—')}</td>
    </tr>`).join('');
  const basisText = (basis && basis.length) ? basis.join(' / ') : '摘要相似度';
  m.innerHTML = `<h2 style="margin-bottom:10px;">批量归类为「${_escHtml(category)}」</h2>
    <p class="muted" style="margin-bottom:6px;line-height:1.6;">
      系统根据【${_escHtml(basisText)}】为您找到了 <b>${items.length}</b> 条相似记录。默认全选，可取消勾选。
    </p>
    <p style="margin-bottom:10px;font-size:13px;">已选中 <b id="batchSel">${items.length}</b> 条（共 ${items.length} 条相似记录）</p>
    <div style="max-height:44vh;overflow:auto;">
      <table>
        <thead><tr><th style="width:44px;">选择</th><th>ID</th><th>发票号</th><th>开票日期</th><th>报销内容</th><th>销售方</th><th>当前分类</th><th>状态</th><th>命中原因</th><th style="text-align:right;">价税合计</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="text-align:right;margin-top:14px;">
      <button class="btn btn-outline" id="batchSkip">仅保存当前单条</button>
      <button class="btn" id="batchOk">确认批量修改（已选 ${items.length} 条）</button>
    </div>`;
  openModal();
  const chks = [...document.querySelectorAll('.batch-chk')];
  const btnSkip = document.getElementById('batchSkip');
  const btnOk = document.getElementById('batchOk');
  // 按钮状态随勾选数联动：>0 时【仅保存当前单条】/【确认批量修改（已选 N 条）】；
  // =0 时左侧变【取消】、右侧置灰禁用并提示先勾选（防呆）
  const updBtns = () => {
    const n = chks.filter(x => x.checked).length;
    document.getElementById('batchSel').textContent = n;
    if(n === 0){
      btnSkip.textContent = '取消';
      btnOk.textContent = '请先勾选需要修改的记录';
      btnOk.disabled = true;
      btnOk.style.opacity = '.5';
      btnOk.style.cursor = 'not-allowed';
    }else{
      btnSkip.textContent = '仅保存当前单条';
      btnOk.textContent = '确认批量修改（已选 ' + n + ' 条）';
      btnOk.disabled = false;
      btnOk.style.opacity = '';
      btnOk.style.cursor = '';
    }
  };
  chks.forEach(c => c.addEventListener('change', updBtns));
  updBtns();
  // 左侧按钮：有勾选=仅保留刚才的单条修改（单条已生效，确认后关闭）；零勾选=取消直接关闭
  btnSkip.onclick = async () => {
    const n = chks.filter(x => x.checked).length;
    if(n > 0){
      const ok = await confirmDlg('确定仅修改当前这 1 条发票吗？');
      if(!ok) return;
    }
    closeModal();
    location.reload();
  };
  btnOk.onclick = async () => {
    const sel = chks.filter(x => x.checked);
    if(!sel.length) return;
    // 二次防呆确认：含已匹配数据时追加红字风险提示（主从联动）
    const hasMatched = sel.some(x => x.dataset.matched === '1');
    let warn = '确定将勾选的 ' + sel.length + ' 条记录统一修改为【' + category + '】吗？';
    if(hasMatched){
      warn += '\n⚠️ 注意：选中包含已匹配数据，该操作会同步更新关联的报销单，系统将自动执行财务主从账目联动同步！';
    }
    const ok = await confirmDlg(warn);
    if(!ok) return;
    const fd = new FormData();
    fd.append('ids', sel.map(x => x.value).join(','));
    fd.append('category', category);
    const d = await _postData('/api/invoices/category/batch', fd);
    closeModal();
    if(!d || d.ok === false){ toast((d && d.message) || '批量更新失败', false); return; }
    toast(d.message || '批量更新成功');
    setTimeout(() => location.reload(), 700);
  };
}

// 模块一：新增自定义分类；若与已有分类高度相似，提示合并
async function addCategoryDlg(){
  closeCatMenu();
  const name = await promptDlg('请输入新的费用分类名称：', '');
  if(!name || !name.trim()) return;
  const fd = new FormData();
  fd.append('name', name.trim());
  let d = await _postData('/api/categories', fd);
  if(d && d.ok && d.need_confirm){
    const sim = (d.similar || [])[0] || '';
    const opt = await chooseDlg(
      '发现相似分类',
      '「' + name.trim() + '」与已有分类' + d.similar.map(s => '「' + s + '」').join('、') +
      ' 高度相似，建议合并到已有分类，历史数据会一并同步。',
      [{v:'merge', label:'合并到「' + sim + '」'},
       {v:'force', label:'仍然新增', cls:'btn btn-outline'}]);
    if(!opt) return;
    const fd2 = new FormData();
    fd2.append('name', name.trim());
    if(opt === 'merge') fd2.append('merge_into', sim);
    else fd2.append('force', '1');
    d = await _postData('/api/categories', fd2);
  }
  if(d && d.ok){ toast(d.message || '已保存'); setTimeout(() => location.reload(), 900); }
  else { toast((d && d.message) || '新增失败', false); }
}

// 自定义确认弹窗：内嵌浏览器不支持原生 confirm()，改用模态框实现
function confirmDlg(msg){
  return new Promise(resolve=>{
    const m = document.getElementById('modal');
    m.innerHTML = '<p style="margin-bottom:16px;white-space:pre-line;line-height:1.6;">' + msg + '</p>'
      + '<div style="text-align:right;">'
      + '<button class="btn btn-outline" id="cfCancel">取消</button> '
      + '<button class="btn btn-danger" id="cfOk">确认</button></div>';
    openModal();
    document.getElementById('cfOk').onclick = ()=>{closeModal();resolve(true);};
    document.getElementById('cfCancel').onclick = ()=>{closeModal();resolve(false);};
    document.getElementById('modalBg').onclick = ()=>{closeModal();resolve(false);};
  });
}
// 多选项弹窗：用于「仅改报销单 / 同步更新关联发票」「合并 / 仍然新增」等二选一场景
// options: [{v:'值', label:'按钮文字', cls:'额外样式'}]，返回所选值或 null（取消）
function chooseDlg(title, msg, options){
  return new Promise(resolve=>{
    const m = document.getElementById('modal');
    const btns = options.map((o, i) =>
      `<button class="btn ${o.cls || ''}" data-opt="${i}">${o.label}</button>`).join(' ');
    m.innerHTML = '<h2 style="margin-bottom:10px;font-size:16px;">' + title + '</h2>'
      + '<p style="margin-bottom:16px;white-space:pre-line;line-height:1.6;">' + msg + '</p>'
      + '<div style="text-align:right;">' + btns
      + ' <button class="btn btn-outline" data-cancel="1">取消</button></div>';
    openModal();
    m.querySelectorAll('button[data-opt]').forEach(b=>{
      b.onclick = ()=>{ const v = options[+b.dataset.opt].v; closeModal(); resolve(v); };
    });
    m.querySelector('button[data-cancel]').onclick = ()=>{ closeModal(); resolve(null); };
    document.getElementById('modalBg').onclick = ()=>{ closeModal(); resolve(null); };
  });
}
// 自定义输入弹窗：内嵌浏览器不支持原生 prompt()，改用模态框实现。返回 Promise<string|null>
function promptDlg(msg, def=''){
  return new Promise(resolve=>{
    const m = document.getElementById('modal');
    m.innerHTML = '<p style="margin-bottom:10px;line-height:1.6;">' + msg + '</p>'
      + '<input id="pfInput" style="width:100%;" value="' + (def||'').replace(/"/g,'&quot;') + '">'
      + '<div style="text-align:right;margin-top:14px;">'
      + '<button class="btn btn-outline" id="pfCancel">取消</button> '
      + '<button class="btn" id="pfOk">确定</button></div>';
    openModal();
    const input = document.getElementById('pfInput');
    input.focus(); input.select();
    document.getElementById('pfOk').onclick = ()=>{const v=input.value;closeModal();resolve(v);};
    document.getElementById('pfCancel').onclick = ()=>{closeModal();resolve(null);};
    document.getElementById('modalBg').onclick = ()=>{closeModal();resolve(null);};
    input.onkeydown = e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('pfOk').click();}};
  });
}
// 人工干预强制原因选择（模块二）：确认/拒绝/解除/人工绑定/强制修复都必须选择依据
const REASON_OPTIONS = ['业务人员已确认', '员工补了凭证', '票号填错已核实', '特殊情况'];
// 返回 Promise<{reason_option, reason}|null>；选「特殊情况」时详细说明必填，未填则确认按钮置灰
function reasonModal(title){
  return new Promise(resolve=>{
    const bg = document.getElementById('modalBg');
    const dlg = document.createElement('div');
    dlg.className = 'modal';
    dlg.style.width = '460px';
    dlg.style.display = 'block';
    bg.style.display = 'block';
    const done = v=>{ dlg.remove(); bg.style.display='none'; bg.onclick=()=>closeModal(); resolve(v); };
    dlg.innerHTML = '<h2 style="margin-bottom:12px;font-size:16px;">' + (title||'请选择原因') + '</h2>'
      + '<label class="muted" style="display:block;margin-bottom:6px;">原因（必选）</label>'
      + '<select id="rmOpt" style="width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;">'
      + '<option value="">— 请选择 —</option>'
      + REASON_OPTIONS.map(o=>'<option value="'+o+'">'+o+'</option>').join('')
      + '</select>'
      + '<div id="rmCustomWrap" style="display:none;margin-top:10px;">'
      + '<label class="muted" style="display:block;margin-bottom:6px;">详细说明（必填）</label>'
      + '<textarea id="rmCustom" rows="3" style="width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;" placeholder="请说明具体情况..."></textarea>'
      + '</div>'
      + '<div style="text-align:right;margin-top:14px;">'
      + '<button class="btn btn-outline" id="rmCancel">取消</button> '
      + '<button class="btn" id="rmOk" disabled>确认</button></div>';
    document.body.appendChild(dlg);
    const opt = dlg.querySelector('#rmOpt');
    const wrap = dlg.querySelector('#rmCustomWrap');
    const custom = dlg.querySelector('#rmCustom');
    const ok = dlg.querySelector('#rmOk');
    const sync = ()=>{ ok.disabled = !opt.value || (opt.value==='特殊情况' && !custom.value.trim()); };
    opt.onchange = ()=>{ wrap.style.display = opt.value==='特殊情况' ? 'block' : 'none'; sync(); };
    custom.oninput = sync;
    dlg.querySelector('#rmCancel').onclick = ()=>done(null);
    ok.onclick = ()=>done({reason_option: opt.value, reason: custom.value.trim()});
    bg.onclick = ()=>done(null);
  });
}
// ---- 底部分页：保留现有筛选参数，仅改写目标页码参数 ----
function pagerGo(param, page){
  const u = new URL(location.href);
  u.searchParams.set(param, page);
  location.href = u.toString();
}
// 切换每页条数：重置所有页码参数（避免旧页码超出新页数）
function pagerSize(v){
  const u = new URL(location.href);
  u.searchParams.set('page_size', v);
  ['page','dpage','rpage','ipage','apage','xpage'].forEach(p=>u.searchParams.delete(p));
  location.href = u.toString();
}
// 下拉选择：选中「自定义」时展开输入框，选中预设值则直接切换
function pagerSizeSel(sel){
  const wrap = sel.closest('.pager');
  const box = wrap.querySelector('.pager-custom');
  if(sel.value === 'custom'){
    box.style.display = 'inline-flex';
    const input = box.querySelector('.pager-custom-input');
    input.value = ''; input.focus();
    return;
  }
  box.style.display = 'none';
  pagerSize(sel.value);
}
// 只允许输入数字（防止粘贴/输入法带入非数字字符）
function pagerDigits(el){
  const clean = el.value.replace(/[^0-9]/g, '').slice(0, 4);
  if(clean !== el.value) el.value = clean;
}
// 自定义每页条数：校验 1~1000 后跳转
function pagerCustom(btn){
  const wrap = btn.closest('.pager');
  const input = wrap.querySelector('.pager-custom-input');
  const v = parseInt(input.value, 10);
  if(!v || v < 1){ toast('请输入大于 0 的条数', false); input.focus(); return; }
  if(v > 1000){ toast('每页最多 1000 条', false); input.focus(); return; }
  pagerSize(v);
}
function switchTab(e,id){
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
  e.classList.add('active');document.getElementById(id).classList.add('active');
}
// 按 paneId 激活 Tab（供路由联动 ?tab= 自动切换）
function activateTab(paneId){
  const pane=document.getElementById(paneId);
  if(!pane) return;
  document.querySelectorAll('.tabs .tab').forEach(t=>{
    const oc=t.getAttribute('onclick')||'';
    t.classList.toggle('active', oc.includes("'"+paneId+"'"));
  });
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active', p.id===paneId));
}
// focus 定位高亮：页面渲染完成后找到 #row-{focus_id}，平滑滚动至中央并闪烁
// 页面可在自身 scripts 块定义 window.preFocus（如先切换 Tab），会在高亮前调用
function applyFocus(){
  const fid=new URLSearchParams(location.search).get('focus_id');
  if(!fid) return;
  if(typeof window.preFocus==='function') window.preFocus();
  requestAnimationFrame(()=>{
    const el=document.getElementById('row-'+fid);
    if(!el) return;
    el.classList.add('row-focus');
    el.scrollIntoView({behavior:'smooth',block:'center'});
  });
}
document.addEventListener('DOMContentLoaded',applyFocus);
</script>
