{% extends "base.html" %}
{% block content %}
<style>
.auth-wrap{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;}
.auth-card{width:400px;max-width:94vw;background:#fff;border-radius:14px;
  box-shadow:0 18px 50px rgba(15,23,42,.10);padding:34px 34px 28px;}
.auth-logo{text-align:center;font-size:13px;color:var(--primary);font-weight:600;letter-spacing:.5px;}
.auth-title{margin:10px 0 4px;text-align:center;font-size:20px;font-weight:700;color:var(--text);}
.auth-sub{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:24px;line-height:1.8;}
.auth-field{margin-bottom:16px;}
.auth-field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;}
.auth-field input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;outline:none;transition:.15s;}
.auth-field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.10);}
.auth-btn{width:100%;padding:11px;border:none;border-radius:8px;background:var(--primary);color:#fff;
  font-size:14px;font-weight:600;cursor:pointer;margin-top:18px;}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;}
.auth-err{display:none;margin-top:14px;padding:9px 12px;border-radius:8px;background:#fef2f2;
  color:#dc2626;font-size:13px;border:1px solid #fecaca;}
</style>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">发票报销核对助手</div>
    <div class="auth-title">修改密码</div>
    <div class="auth-sub">
      {% if request.state.user.must_change_pwd %}密码已被重置，请先设置新密码后继续使用{% else %}定期修改密码可提升账号安全{% endif %}
    </div>
    <form id="pwdForm" onsubmit="return doChange(event)">
      <div class="auth-field">
        <label>原密码</label>
        <input id="oldPwd" type="password" autocomplete="current-password" placeholder="请输入当前密码" required autofocus>
      </div>
      <div class="auth-field">
        <label>新密码</label>
        <input id="newPwd" type="password" autocomplete="new-password" placeholder="至少 8 位" required>
      </div>
      <div class="auth-field">
        <label>确认新密码</label>
        <input id="confirmPwd" type="password" autocomplete="new-password" placeholder="再次输入新密码" required>
      </div>
      <button class="auth-btn" id="pwdBtn" type="submit">保存新密码</button>
      <div class="auth-err" id="pwdErr"></div>
    </form>
  </div>
</div>
<script>
function showErr(msg){
  const box = document.getElementById('pwdErr');
  box.textContent = msg; box.style.display = 'block';
}
async function doChange(ev){
  ev.preventDefault();
  const btn = document.getElementById('pwdBtn');
  document.getElementById('pwdErr').style.display = 'none';
  const oldPwd = document.getElementById('oldPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const confirmPwd = document.getElementById('confirmPwd').value;
  if(newPwd.length < 8){ showErr('新密码至少 8 位'); return false; }
  if(newPwd !== confirmPwd){ showErr('两次输入的新密码不一致'); return false; }
  btn.disabled = true; btn.textContent = '保存中…';
  try{
    const r = await fetch('/api/auth/change-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({old_password: oldPwd, new_password: newPwd})
    });
    const d = await r.json();
    if(!r.ok || !d.ok){ showErr(d.message || '修改失败'); return false; }
    location.href = d.redirect || '/';
  }catch(e){
    showErr('网络异常，请稍后重试');
  }finally{
    btn.disabled = false; btn.textContent = '保存新密码';
  }
  return false;
}
</script>
{% endblock %}
