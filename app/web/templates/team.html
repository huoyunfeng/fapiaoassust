{% extends "base.html" %}
{% block content %}
<style>
.tm-wrap{max-width:1000px;margin:26px auto 60px;}
.tm-card{background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-bottom:18px;}
.tm-card h1{font-size:17px;margin-bottom:4px;}
.tm-card .hint{font-size:12px;color:#94a3b8;line-height:1.8;margin-bottom:14px;}
.tm-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.tm-row .f{display:flex;flex-direction:column;gap:5px;}
.tm-row .f label{font-size:12px;color:var(--text-2);}
.tm-row .f input,.tm-row .f select{padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;min-width:150px;}
.tm-btn{padding:9px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;
  font-size:13px;font-weight:600;cursor:pointer;}
.tm-btn.ghost{background:#fff;border:1px solid var(--border);color:var(--text-2);}
.tm-table{width:100%;border-collapse:collapse;font-size:13px;}
.tm-table th{text-align:left;color:#94a3b8;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border);}
.tm-table td{padding:10px;border-bottom:1px solid #f1f5f9;}
.tm-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;background:#f1f5f9;color:#64748b;}
.tm-pill.admin{background:#eff6ff;color:#1d4ed8;}
.tm-pill.finance{background:#ecfdf5;color:#047857;}
.tm-pill.emp{background:#f8fafc;color:#64748b;}
.tm-pill.off{background:#fef2f2;color:#dc2626;}
.tm-act{display:flex;gap:6px;flex-wrap:wrap;}
.tm-mini{padding:4px 9px;border-radius:6px;border:1px solid var(--border);background:#fff;
  font-size:12px;cursor:pointer;color:var(--text-2);}
.tm-mini.danger{color:#dc2626;border-color:#fecaca;}
.tm-msg{display:none;margin-top:12px;padding:9px 12px;border-radius:8px;font-size:13px;}
</style>
<div class="tm-wrap">
  <div class="tm-card">
    <h1>团队管理</h1>
    <div class="hint">企业版专属能力。员工只能看到自己上传的发票与报销单，财务可见全部业务数据，管理员拥有全部权限。</div>
    <div class="tm-row">
      <div class="f"><label>账号</label><input id="nUser" placeholder="如 zhangsan"></div>
      <div class="f"><label>显示名称</label><input id="nName" placeholder="如 张三"></div>
      <div class="f"><label>角色</label>
        <select id="nRole">
          <option value="employee">员工（仅本人数据）</option>
          <option value="finance">财务（全部业务数据）</option>
          <option value="admin">管理员（含团队与授权）</option>
        </select>
      </div>
      <div class="f"><label>初始密码</label><input id="nPwd" type="password" placeholder="至少 8 位"></div>
      <button class="tm-btn" id="createBtn" type="button" onclick="createUser()">创建账号</button>
    </div>
    <div class="tm-msg" id="tmMsg"></div>
  </div>

  <div class="tm-card">
    <table class="tm-table">
      <thead><tr><th>账号</th><th>名称</th><th>角色</th><th>状态</th><th>最近登录</th><th style="width:220px;">操作</th></tr></thead>
      <tbody id="userRows">
      {% for u in users %}
        <tr data-id="{{ u.id }}">
          <td><strong>{{ u.username }}</strong></td>
          <td>{{ u.display_name }}</td>
          <td><span class="tm-pill {{ u.role if u.role != 'employee' else 'emp' }}">{{ u.role_cn }}</span></td>
          <td><span class="tm-pill {{ '' if u.is_active else 'off' }}">{{ '正常' if u.is_active else '已停用' }}</span></td>
          <td class="muted">{{ u.last_login_at or '—' }}</td>
          <td>
            <div class="tm-act">
              <button class="tm-mini" type="button" onclick="toggleUser({{ u.id }}, {{ 'false' if u.is_active else 'true' }})">{{ '停用' if u.is_active else '启用' }}</button>
              <button class="tm-mini" type="button" onclick="resetUser({{ u.id }}, '{{ u.username }}')">重置密码</button>
              <button class="tm-mini danger" type="button" onclick="delUser({{ u.id }}, '{{ u.username }}')">删除</button>
            </div>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
<script>
function msg(text, ok){
  const m = document.getElementById('tmMsg');
  m.textContent = text; m.style.display = 'block';
  m.style.background = ok ? '#f0fdf4' : '#fef2f2';
  m.style.color = ok ? '#15803d' : '#dc2626';
}
async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body || {})});
  return {ok: r.ok, data: await r.json()};
}
async function createUser(){
  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  try{
    const res = await post('/api/team/users', {
      username: document.getElementById('nUser').value.trim(),
      display_name: document.getElementById('nName').value.trim(),
      role: document.getElementById('nRole').value,
      password: document.getElementById('nPwd').value
    });
    if(!res.data.ok){ msg(res.data.message || '创建失败', false); return; }
    msg('账号已创建', true);
    setTimeout(()=>location.reload(), 700);
  }catch(e){ msg('网络异常', false); }
  finally{ btn.disabled = false; }
}
async function toggleUser(id, active){
  const res = await post(`/api/team/users/${id}/toggle`, {active: active});
  if(!res.data.ok){ alert(res.data.message || '操作失败'); return; }
  location.reload();
}
async function resetUser(id, name){
  const pwd = prompt(`为 ${name} 设置新密码（至少 8 位）`);
  if(!pwd) return;
  const res = await post(`/api/team/users/${id}/reset`, {password: pwd});
  if(!res.data.ok){ alert(res.data.message || '重置失败'); return; }
  alert('密码已重置');
}
async function delUser(id, name){
  if(!confirm(`确认删除账号 ${name}？该账号的历史数据仍保留。`)) return;
  const r = await fetch(`/api/team/users/${id}`, {method:'DELETE'});
  const d = await r.json();
  if(!d.ok){ alert(d.message || '删除失败'); return; }
  location.reload();
}
</script>
{% endblock %}
