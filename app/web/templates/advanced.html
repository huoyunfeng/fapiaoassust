{% extends "base.html" %}
{% block content %}
<style>
.ad-wrap{max-width:880px;margin:26px auto 60px;}
.ad-card{background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-bottom:18px;}
.ad-card h1{font-size:17px;margin-bottom:4px;}
.ad-card h2{font-size:15px;margin-bottom:4px;}
.ad-card .hint{font-size:12px;color:#94a3b8;line-height:1.9;margin-bottom:14px;}
.ad-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.ad-row input{flex:1;min-width:260px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
.ad-btn{padding:10px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;
  font-size:13px;font-weight:600;cursor:pointer;}
.ad-btn.ghost{background:#fff;border:1px solid var(--border);color:var(--text-2);}
.ad-btn:disabled{opacity:.6;cursor:not-allowed;}
.ad-msg{display:none;margin-top:12px;padding:9px 12px;border-radius:8px;font-size:13px;line-height:1.8;}
.ad-stat{display:flex;gap:24px;font-size:13px;color:var(--text-2);margin-bottom:12px;}
.ad-stat b{color:var(--text);}
</style>
<div class="ad-wrap">
  <div class="ad-card">
    <h1>附件存储目录</h1>
    <div class="hint">
      迁移前系统会强制断开数据库连接，再物理移动文件；任何失败都会自动回滚到原目录，不会产生半迁移数据。
      路径会记住并在下次启动时自动生效。
    </div>
    <div class="ad-row">
      <input id="dirInput" value="{{ upload_dir }}">
      <button class="ad-btn ghost" type="button" onclick="pickFolder()">选择文件夹</button>
      <button class="ad-btn" id="migBtn" type="button" onclick="migrate()">迁移到该目录</button>
    </div>
    <div class="ad-msg" id="dirMsg"></div>
  </div>

  <div class="ad-card">
    <h2>多设备数据交接包</h2>
    <div class="hint">
      子设备导出完整台账（含附件）为 zip；主设备导入后按发票号自动去重合并，匹配状态可在主设备重新执行匹配。
    </div>
    <div class="ad-stat">
      <span>当前发票：<b>{{ counts.invoices }}</b> 张</span>
      <span>当前报销单：<b>{{ counts.reimburses }}</b> 条</span>
    </div>
    <div class="ad-row">
      <a class="ad-btn" style="text-decoration:none;" href="/api/exchange/export">导出交接包</a>
      <input type="file" id="pkgInput" accept=".zip" style="min-width:200px;">
      <button class="ad-btn" id="impBtn" type="button" onclick="importPkg()">导入并合并</button>
    </div>
    <div class="ad-msg" id="exMsg"></div>
  </div>
</div>
<script>
function show(id, text, ok){
  const m = document.getElementById(id);
  m.textContent = text; m.style.display = 'block';
  m.style.background = ok ? '#f0fdf4' : '#fef2f2';
  m.style.color = ok ? '#15803d' : '#dc2626';
}
async function pickFolder(){
  try{
    const r = await fetch('/api/storage/pick-folder', {method:'POST'});
    const d = await r.json();
    if(!d.ok){ show('dirMsg', d.message || '未选择目录', false); return; }
    document.getElementById('dirInput').value = d.path;
  }catch(e){ show('dirMsg', '网络异常', false); }
}
async function migrate(){
  const btn = document.getElementById('migBtn');
  const path = document.getElementById('dirInput').value.trim();
  if(!path){ show('dirMsg', '请填写或选择目标目录', false); return; }
  if(!confirm('迁移期间将短暂断开数据库连接，确认继续？')) return;
  btn.disabled = true; btn.textContent = '迁移中…';
  try{
    const r = await fetch('/api/storage/migrate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({path})
    });
    const d = await r.json();
    show('dirMsg', d.data ? `迁移完成：${d.data.moved} 项，已切换到 ${d.data.new}` : (d.message || '迁移失败'), !!d.ok);
  }catch(e){ show('dirMsg', '网络异常', false); }
  finally{ btn.disabled = false; btn.textContent = '迁移到该目录'; }
}
async function importPkg(){
  const file = document.getElementById('pkgInput').files[0];
  if(!file){ show('exMsg', '请先选择交接包 zip', false); return; }
  const btn = document.getElementById('impBtn');
  btn.disabled = true; btn.textContent = '导入中…';
  try{
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch('/api/exchange/import', {method:'POST', body: fd});
    const d = await r.json();
    if(!d.ok){ show('exMsg', d.message || '导入失败', false); return; }
    show('exMsg', `导入完成：发票 ${d.data.invoices_imported} 张（跳过 ${d.data.invoices_skipped}），`
      + `报销单 ${d.data.reimburses_imported} 条（跳过 ${d.data.reimburses_skipped}）`, true);
  }catch(e){ show('exMsg', '网络异常', false); }
  finally{ btn.disabled = false; btn.textContent = '导入并合并'; }
}
</script>
{% endblock %}
