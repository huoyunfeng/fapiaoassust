{% extends "base.html" %}
{% block content %}
<style>
.auth-wrap{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;}
.auth-card{width:430px;max-width:94vw;background:#fff;border-radius:14px;
  box-shadow:0 18px 50px rgba(15,23,42,.10);padding:32px 34px 26px;}
.auth-logo{text-align:center;font-size:13px;color:var(--primary);font-weight:600;}
.auth-title{margin:10px 0 4px;text-align:center;font-size:20px;font-weight:700;}
.auth-sub{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:22px;line-height:1.7;}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;}
.auth-field input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;outline:none;}
.auth-field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.10);}
.auth-btn{width:100%;padding:11px;border:none;border-radius:8px;background:var(--primary);color:#fff;
  font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
.auth-err{display:none;margin-top:12px;padding:9px 12px;border-radius:8px;background:#fef2f2;
  color:#dc2626;font-size:13px;border:1px solid #fecaca;}
/* 不可关闭的恢复码模态框 */
.rc-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:2000;
  display:flex;align-items:center;justify-content:center;}
.rc-card{width:520px;max-width:94vw;background:#fff;border-radius:14px;padding:28px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);}
.rc-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px;}
.rc-tip{font-size:13px;color:var(--text-2);line-height:1.8;}
.rc-code{margin:18px 0;padding:16px;border-radius:10px;background:#f8fafc;border:1px dashed #cbd5e1;
  text-align:center;font-size:22px;letter-spacing:2px;font-weight:700;color:#0f172a;
  font-family:ui-monospace,Consolas,monospace;user-select:all;}
.rc-actions{display:flex;gap:10px;align-items:center;justify-content:space-between;}
.rc-check{font-size:13px;color:var(--text-2);display:flex;gap:8px;align-items:flex-start;line-height:1.6;}
.rc-btn{padding:10px 18px;border:none;border-radius:8px;background:var(--primary);color:#fff;
  font-size:13px;font-weight:600;cursor:pointer;}
.rc-btn:disabled{background:#cbd5e1;cursor:not-allowed;}
.rc-copy{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 14px;
  font-size:13px;cursor:pointer;color:var(--text-2);}
.rc-warn{margin-top:14px;padding:10px 12px;border-radius:8px;background:#fffbeb;color:#92400e;
  font-size:12px;border:1px solid #fde68a;line-height:1.7;}
</style>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">发票报销核对助手</div>
    <div class="auth-title">首次初始化</div>
    <div class="auth-sub">创建第一位管理员账号。系统初始化后，其余账号由管理员在「团队管理」中开通。</div>
    <form onsubmit="return doSetup(event)">
      <div class="auth-field"><label>管理员账号</label>
        <input id="suUsername" placeholder="如 admin" required autofocus></div>
      <div class="auth-field"><label>显示名称</label>
        <input id="suName" placeholder="如 财务主管"></div>
      <div class="auth-field"><label>登录密码（至少 8 位）</label>
        <input id="suPassword" type="password" required></div>
      <div class="auth-field"><label>确认密码</label>
        <input id="suConfirm" type="password" required></div>
      <button class="auth-btn" id="suBtn" type="submit">创建管理员并进入系统</button>
      <div class="auth-err" id="suErr"></div>
    </form>
  </div>
</div>

<div class="rc-bg" id="rcModal" style="display:none;">
  <div class="rc-card">
    <div class="rc-title">请立即保存您的 16 位应急恢复码</div>
    <div class="rc-tip">忘记密码或账号锁死时，这是管理员找回系统的唯一凭证。恢复码<strong>只展示这一次</strong>，
      请抄写或截图保存到安全位置。</div>
    <div class="rc-code" id="rcCode"></div>
    <div class="rc-actions">
      <button class="rc-copy" type="button" onclick="copyCode()">复制恢复码</button>
      <button class="rc-btn" id="rcOk" type="button" disabled onclick="ackAndEnter()">我已妥善保存，进入系统</button>
    </div>
    <label class="rc-check" style="margin-top:16px;">
      <input type="checkbox" id="rcChecked" onchange="document.getElementById('rcOk').disabled = !this.checked;">
      <span>我确认已妥善保存该恢复码，并理解丢失后只能通过客服解锁码恢复。</span>
    </label>
    <div class="rc-warn">安全提示：请勿把恢复码与登录密码存放在同一处；请勿截图发送到公共群聊。</div>
  </div>
</div>
<script>
function showErr(msg){
  const b = document.getElementById('suErr');
  b.textContent = msg; b.style.display = 'block';
}
async function doSetup(ev){
  ev.preventDefault();
  const pwd = document.getElementById('suPassword').value;
  if(pwd.length < 8){ showErr('密码至少 8 位'); return false; }
  if(pwd !== document.getElementById('suConfirm').value){ showErr('两次输入的密码不一致'); return false; }
  const btn = document.getElementById('suBtn');
  btn.disabled = true; btn.textContent = '创建中…';
  document.getElementById('suErr').style.display = 'none';
  try{
    const r = await fetch('/api/auth/setup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('suUsername').value.trim(),
        display_name: document.getElementById('suName').value.trim(),
        password: pwd
      })
    });
    const d = await r.json();
    if(!r.ok || !d.ok){ showErr(d.message || '初始化失败'); return false; }
    document.getElementById('rcCode').textContent = d.recovery_code;
    document.getElementById('rcModal').style.display = 'flex';
    window.__recoveryCode = d.recovery_code;
  }catch(e){
    showErr('网络异常，请稍后重试');
  }finally{
    btn.disabled = false; btn.textContent = '创建管理员并进入系统';
  }
  return false;
}
function copyCode(){
  const code = window.__recoveryCode || '';
  if(!navigator.clipboard){
    toast('当前浏览器不支持自动复制，请手动抄写', false); return;
  }
  navigator.clipboard.writeText(code).then(()=>toast('恢复码已复制'));
}
async function ackAndEnter(){
  try{
    await fetch('/api/auth/recovery-ack', {method:'POST'});
  }catch(e){}
  location.href = '/';
}
</script>
{% endblock %}
